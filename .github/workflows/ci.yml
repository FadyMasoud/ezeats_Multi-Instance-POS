name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Identical to the git pre-commit hook (.husky/pre-commit).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ezeats_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ezeats
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ezeats_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:int

  chaos:
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chaos test (docker compose, two API instances, one SIGKILLed mid-run)
        run: npm run test:chaos
        env:
          CHAOS_MODE: docker
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
      - if: always()
        run: docker compose down -v
