name: ezeats

x-api-env: &api-env
  DATABASE_URL: postgres://ezeats:ezeats@postgres:5432/ezeats
  POS_BASE_URL: http://fake-pos:4000
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  PORT: "3000"

x-api: &api
  build:
    context: .
    target: api
  depends_on:
    migrate:
      condition: service_completed_successfully
    fake-pos:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
    interval: 3s
    timeout: 2s
    retries: 30
  # Long enough for in-flight POS calls (POS_TIMEOUT_MS) to finish and be recorded on SIGTERM.
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ezeats
      POSTGRES_PASSWORD: ezeats
      POSTGRES_DB: ezeats
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezeats -d ezeats"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-shot: applies the generated Drizzle migrations before any API instance starts.
  migrate:
    build:
      context: .
      target: api
    command: ["node", "dist/db/migrate.js"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  fake-pos:
    build:
      context: .
      target: fake-pos
    environment:
      PORT: "4000"
      FAIL_RATE: ${FAIL_RATE:-0}
      TIMEOUT_AFTER_CREATE_RATE: ${TIMEOUT_AFTER_CREATE_RATE:-0}
      SLOW_RATE: ${SLOW_RATE:-0}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
    ports:
      - "3001:3000"

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    ports:
      - "3002:3000"

  # nginx: load-balances /api/* across both API instances and serves the admin UI.
  admin:
    build:
      context: .
      target: admin
    ports:
      - "8080:80"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

volumes:
  pgdata:
