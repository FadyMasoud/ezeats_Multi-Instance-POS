# The "load balancer" in front of the API instances, plus the static admin UI.

# Docker's embedded DNS. With `resolve` below, nginx re-resolves api-1/api-2, so an instance that
# is killed and restarted (possibly with a new IP) rejoins the pool without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream ezeats_api {
  zone ezeats_api 64k;
  server api-1:3000 resolve max_fails=1 fail_timeout=5s;
  server api-2:3000 resolve max_fails=1 fail_timeout=5s;
}

server {
  listen 80;
  server_name _;

  # /api/checks/... -> http://api-N:3000/checks/...
  location /api/ {
    proxy_pass http://ezeats_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    # Fail over to the other instance when one is down. nginx never re-sends a POST that may
    # have reached an upstream (non_idempotent is deliberately not set).
    proxy_next_upstream error timeout http_502 http_503;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
